name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

# One publish at a time: two releases racing would fight over the dist-tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Trusted publishing: npm authenticates this workflow through a GitHub
      # OIDC token instead of a stored NPM_TOKEN.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Node 22 still bundles npm 10; trusted publishing needs 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run verify

      - name: Resolve the version and dist-tag
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version ${version}." >&2
            exit 1
          fi
          # A prerelease belongs on `next` — but only once a stable release exists for
          # `latest` to hold. npm gives `latest` to whichever version is published first
          # and never moves it on its own, so before the first stable release `latest`
          # would pin `npm install` to the oldest alpha forever. OIDC authenticates
          # `npm publish` only, so this has to be decided here, not fixed afterwards
          # with `npm dist-tag add`.
          case "$version" in
            *-*)
              name="$(node -p 'require("./package.json").name')"
              stable="$(npm view "$name" versions --json 2>/dev/null | node -e '
                let raw = "";
                process.stdin.on("data", chunk => raw += chunk).on("end", () => {
                  let all = [];
                  try { all = JSON.parse(raw); } catch { all = []; }
                  // A single-version package answers with a bare string, and an
                  // unpublished one answers with an error object on stdout.
                  if (typeof all === "string") all = [all];
                  if (!Array.isArray(all)) all = [];
                  process.stdout.write(all.some(v => typeof v === "string" && !v.includes("-")) ? "yes" : "no");
                });
              ')"
              if [ "$stable" = "yes" ]; then tag=next; else tag=latest; fi
              ;;
            *) tag=latest ;;
          esac
          echo "Publishing ${version} under dist-tag ${tag}."
          echo "DIST_TAG=$tag" >> "$GITHUB_ENV"

      # No NODE_AUTH_TOKEN: the OIDC exchange above is the credential, and npm
      # attaches a provenance attestation on its own.
      - run: npm publish --tag "$DIST_TAG"
